<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberty Forum</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#7c3aed,#5b21b6);background-attachment:fixed;min-height:100vh;padding:20px;color:#1f2937;transition:background .3s}
body.dark{background:#0f172a;color:#e5e7eb}
a{color:inherit}
.nav{background:#fff;padding:12px 20px;border-radius:12px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.dark .nav{background:#1e293b;color:#e5e7eb}
.nav button{background:#f3f4f6;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.nav button:hover{background:#e5e7eb}
.nav .active{background:#7c3aed;color:#fff}
.nav .spacer{margin-left:auto;display:flex;gap:8px;align-items:center}
.container{max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
body.dark .card{background:#1e293b;color:#e5e7eb}
input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:14px;font-family:inherit}
body.dark input,body.dark textarea,body.dark select{background:#0f172a;color:#e5e7eb;border-color:#334155}
textarea{resize:vertical;min-height:70px}
button.btn{background:#7c3aed;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:6px}
button.btn:hover{background:#6d28d9}
button.btn.sm{padding:6px 12px;font-size:13px;margin-top:0}
button.btn.danger{background:#ef4444}button.btn.danger:hover{background:#dc2626}
button.btn.ok{background:#16a34a}button.btn.ok:hover{background:#15803d}
button.ghost{background:#e5e7eb;color:#333;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.ghost.sm{padding:5px 10px;font-size:13px}
button.ghost:hover{background:#d1d5db}
h2{margin-bottom:10px}
h3{margin-bottom:8px}
.meta{color:#666;font-size:13px;margin:4px 0}
body.dark .meta{color:#94a3b8}
.comment{border-top:1px solid #eee;padding:8px 0;font-size:14px}
.chat-box{height:300px;overflow-y:auto;background:#f9f9f9;border-radius:10px;padding:12px;margin:10px 0}
body.dark .chat-box{background:#0f172a}
.chat-msg{margin:4px 0;padding:8px 12px;background:#fff;border-radius:10px;max-width:80%;clear:both;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chat-msg.me{background:#7c3aed;color:#fff;margin-left:auto;float:right;clear:both}
body.dark .chat-msg{background:#334155}
.err{color:#ef4444;font-size:13px;margin-top:4px}
.ok{color:#16a34a;font-size:13px;margin-top:4px}
.hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:999;font-size:14px}
.hint.show{opacity:1}
#warn{position:fixed;inset:0;background:#dc2626;z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column}
#warn.show{display:flex}
#warn .icon{font-size:100px;animation:bounce .6s infinite alternate}
#warn .txt{color:#000;font-size:28px;font-weight:900;margin-top:16px;text-shadow:none;-webkit-text-stroke:0;letter-spacing:0}
#warn .sub{color:#000;font-size:16px;margin-top:8px;font-weight:700;text-shadow:none;-webkit-text-stroke:0}
/* 彻底消除警告文字被鼠标长按/选中时产生的蓝色默认高亮 */
#warn .txt::selection,#warn .txt::-moz-selection,#warn .sub::selection,#warn .sub::-moz-selection{background:transparent;color:#000}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-20px)}}
canvas#cap{background:#f3f4f6;border-radius:8px;cursor:pointer;vertical-align:middle}
.tag{display:inline-block;background:#ede9fe;color:#7c3aed;padding:2px 10px;border-radius:999px;font-size:13px;margin-right:6px;cursor:pointer}
.tag.active{background:#7c3aed;color:#fff}
.post-title{font-size:18px;font-weight:700;cursor:pointer;color:#111827}
body.dark .post-title{color:#f1f5f9}
.post-title:hover{color:#7c3aed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input{flex:2;margin:0}
.toolbar select,.toolbar button{flex:0 0 auto;width:auto;margin:0}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:10px}
.pagination button{padding:6px 12px}
.badge{background:#ef4444;color:#fff;border-radius:50%;padding:2px 7px;font-size:11px;margin-left:4px}
.avatar{width:44px;height:44px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;vertical-align:middle}
.avatar.sm{width:30px;height:30px;font-size:14px}
.sub-comment{margin-left:28px;padding:6px 0;border-top:1px dashed #f0f0f0}
.flex{display:flex;gap:10px;align-items:center}
.pm-list{display:flex;gap:14px}
.pm-users{flex:0 0 200px;border-right:1px solid #eee;padding-right:10px;max-height:400px;overflow-y:auto}
.pm-users div{padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.pm-users div.active,.pm-users div:hover{background:#ede9fe}
.pm-box{flex:1}
.unread{background:#fee2e2!important;font-weight:700}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.admin-stats .stat{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.dark .admin-stats .stat{background:#0f172a}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid #eee;padding-bottom:8px}
.tabs button{background:none;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:#666}
.tabs button.active{background:#7c3aed;color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:middle}
th{color:#666;font-weight:600}
tr:hover td{background:#faf5ff}
.muted{color:#9ca3af;font-size:12px}
.report{background:#fff7ed;border-left:4px solid #f97316}
.small{font-size:13px}
.search-hl{background:yellow;padding:0 2px}
.notif-dot{position:relative}
.notif-dot .badge{position:absolute;top:-8px;right:-8px}
.log-entry{font-family:monospace;font-size:12px;padding:4px 0;border-bottom:1px solid #f0f0f0;color:#475569}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;padding:24px;border-radius:14px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
body.dark .modal-box{background:#1e293b;color:#e5e7eb}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.2s}
.switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:#7c3aed}
.switch input:checked+.slider:before{transform:translateX(20px)}
/* ===== 软件商店（火绒商店风格） ===== */

.store-side .brand{padding:4px 16px 12px;font-weight:900;font-size:16px;color:#7c3aed;display:flex;align-items:center;gap:6px}

.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.app-card:hover{box-shadow:0 4px 14px rgba(124,58,237,.15);transform:translateY(-2px)}
.app-card .ico{width:52px;height:52px;border-radius:14px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.app-card .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-card .cat-nm{font-size:11px;color:#94a3b8;margin-top:2px}
.app-card .meta{font-size:11px;color:#64748b;margin-top:4px}
.app-card .badge-free{position:absolute;top:8px;left:8px;background:#16a34a;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}
.app-card .badge-hot{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}

.app-card button{margin-top:8px;padding:5px 0;width:100%;font-size:12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.app-card button.install{background:#7c3aed;color:#fff}

.rank-box{border:1px solid #eee;border-radius:12px;padding:12px}
body.dark .rank-box{border-color:#334155}
.rank-box h4{margin:0 0 8px;font-size:14px}

.store-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:700;opacity:0;transition:.3s;pointer-events:none}
.store-toast.show{opacity:1}
/* 详情弹窗 */
.store-detail .modal-box{max-width:560px}
.store-detail .d-head{display:flex;gap:14px;align-items:center}
.store-detail .d-head .ico{width:64px;height:64px;border-radius:16px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.store-detail .stars{color:#f59e0b;font-size:13px}
.store-detail .tags{margin:10px 0}
.store-detail .tags span{display:inline-block;background:#ede9fe;color:#7c3aed;padding:2px 10px;border-radius:999px;font-size:12px;margin:0 6px 6px 0}

.store-detail .shot div{flex:1;height:70px;border-radius:10px;background:linear-gradient(120deg,#a78bfa,#7c3aed)}

.review{font-size:13px;padding:8px 0;border-bottom:1px solid #eee}

/* ===== 联系我们 ===== */
.contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contact-card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid #eee;border-radius:12px;transition:.15s}

/* 全局页脚（联系我们下方，紫色系，与网站背景统一） */
.footer{background:linear-gradient(135deg,#7c3aed,#4c1d95);color:#f5f3ff;padding:28px 20px 18px;margin-top:32px;font-size:13px;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.footer .f-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

/* ---------- 注销账号确认弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal-mask.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

<body>

<div class="nav" id="nav"></div>
<div class="container" id="app"></div>
<div id="footerEl" class="footer"></div>

<div class="hint" id="hint"></div>
<div id="warn"><div class="icon">⚠️</div><div class="txt">警告</div><div class="sub" id="warnSub"></div></div>

<!-- 通知弹窗 -->
<div class="modal" id="notifModal">
  <div class="modal-box">
    <div class="flex" style="justify-content:space-between"><h2 style="margin:0">🔔 通知中心</h2><button class="ghost sm" onclick="closeNotif()">关闭</button></div>
    <div id="notifList" style="margin-top:12px"></div>
  </div>
</div>

<script>

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showHint = msg => { $('hint').textContent=msg; $('hint').classList.add('show'); clearTimeout($('hint')._t); $('hint')._t=setTimeout(()=>$('hint').classList.remove('show'),2000) };

const CATS = ['综合','技术','生活','闲聊'];

// ---------- 数据持久化 ----------
let users  = safeGet('u', '[]');
let sess   = JSON.parse(sessionStorage.getItem('s')||'null');
let admin  = JSON.parse(sessionStorage.getItem('a')||'null');
let posts  = safeGet('p', '[]');
let chats  = safeGet('c', '[]');
let warns  = safeGet('w', '{}');
let mutes  = safeGet('m', '{}');
let fails  = safeGet('f', '{}');
let pms    = safeGet('pm', '[]');
let reports= safeGet('rp', '[]');
let settings= safeGet('cfg', '{}');
let follows= safeGet('fl', '[]');   // {from,to}
let favs   = safeGet('fv', '[]');   // {user,postId}
let notifs = safeGet('nt', '[]');   // {user,text,time,read,type,link}
let logs   = safeGet('lg', '[]');   // 系统日志
let captcha= '';

const defSet = {
  siteName:'Liberty Forum',allowReg:true,muteBase:60,postsPerPage:5,
  allowGuestChat:true,darkMode:false,requireEmail:false,
  maxPostLength:2000,autoHideReports:false
};
settings = {...defSet,...settings};

// ---------- 初始化种子数据 ----------
function seed(){
  let changed=false;
  if(!posts.length){
    changed=true;
    posts.push({id:1,title:'欢迎来到 Liberty Forum',body:'这是一个功能完整的本地演示论坛。\n\n支持：发帖/编辑/删除、分类、搜索、排序、收藏、关注、评论(二级)、点赞、私信、通知、举报、暗色模式，以及超级管理后台。',author:'admin',cat:'综合',likes:0,views:0,top:true,hidden:false,comments:[],time:Date.now()-1000});
    posts.push({id:2,title:'使用指南',body:'注册一个账号即可发帖。试试收藏、关注、评论吧！',author:'admin',cat:'技术',likes:5,views:20,top:false,hidden:false,comments:[{author:'admin',text:'欢迎体验',time:Date.now()-500,likes:0,replies:[]}],time:Date.now()-5000});
  }
  if(!users.find(u=>u.username==='admin')){
    changed=true;
    users.push({username:'admin',password:'Admin@123',phone:'13800000000',email:'admin@demo.com',role:'admin',bio:'站点管理员',avatar:'',time:Date.now()});
  }
  if(changed) save();
}
seed();

function save(){
  localStorage.setItem('u',JSON.stringify(users));
  localStorage.setItem('p',JSON.stringify(posts));
  localStorage.setItem('c',JSON.stringify(chats));
  localStorage.setItem('w',JSON.stringify(warns));
  localStorage.setItem('m',JSON.stringify(mutes));
  localStorage.setItem('f',JSON.stringify(fails));
  localStorage.setItem('pm',JSON.stringify(pms));
  localStorage.setItem('rp',JSON.stringify(reports));
  localStorage.setItem('cfg',JSON.stringify(settings));
  localStorage.setItem('fl',JSON.stringify(follows));
  localStorage.setItem('fv',JSON.stringify(favs));
  localStorage.setItem('nt',JSON.stringify(notifs));
  localStorage.setItem('lg',JSON.stringify(logs));
}

// ---------- 工具 ----------
const badWords = ['傻逼','sb','cnm','nmsl','操你','fuck','shit','bitch','废物','滚蛋'];
const hasBad = t => badWords.some(w=>String(t).toLowerCase().includes(w));
const curUser = () => sess ? users.find(u=>u.username===sess.username) : null;

// 【安全加固】密码加盐哈希（SHA-256 + 盐），避免明文存储
// 说明：纯前端无法做到真正服务端鉴权，哈希用于降低 localStorage 泄露风险
const PWD_SALT = 'liberty_forum_v1$';
async function hashPwd(pwd){
  if(!pwd) return '';
  if(typeof crypto!=='undefined' && crypto.subtle && crypto.subtle.digest){
    const buf = new TextEncoder().encode(PWD_SALT + pwd);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return 'sha256$' + [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=0; for(let i=0;i<pwd.length;i++){h=(h*31+pwd.charCodeAt(i))|0}
  return 'fallback$' + (PWD_SALT.length*1000 + h).toString(16);
}

// 【安全加固】安全 JSON 解析：类型校验 + 防御原型污染
function safeParse(text, fallback){
  let obj;
  try { obj = JSON.parse(text); } catch(e){ obj = null; }
  if(obj===null || obj===undefined){
    // fallback 可能是字符串形式的 '[]' / '{}'，规范化为真实容器
    if(fallback==='[]') return [];
    if(fallback==='{}') return {};
    return fallback;
  }
  if(typeof obj==='object' && !Array.isArray(obj)){
    delete obj.__proto__; delete obj.constructor; delete obj.prototype;
  }
  return obj;
}
function safeGet(key, fallback){
  const raw = localStorage.getItem(key);
  // 全新浏览器首次访问时 raw 为 null：按 fallback 类型返回合法的空容器
  if(raw===null){
    if(Array.isArray(fallback) || fallback==='[]') return [];
    if((fallback!==null && typeof fallback==='object') || fallback==='{}') return {};
    return fallback;
  }
  const v = safeParse(raw, fallback);
  if(Array.isArray(fallback) && !Array.isArray(v)) return [];
  if(typeof fallback==='object' && !Array.isArray(fallback) && (typeof v!=='object'||v===null)) return fallback;
  return v;
}

const avatarColor = n => ['#7c3aed','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444'][(n||'').charCodeAt(0)%6];

function getMute(u){const m=mutes[u];if(m&&m>Date.now())return m;if(m){delete mutes[u];save()}return 0}

// 违规处理：前 3 次仅文字提醒（不禁言），第 4 次起禁言 3 小时
function incWarn(u){
  warns[u]=(warns[u]||0)+1;
  const count=warns[u];
  // 前 3 次：sec=0 表示不禁言，仅提示；第 4 次起：3 小时 = 10800 秒
  const sec = count>=4 ? 3*60*60 : 0;
  if(sec>0) mutes[u]=Date.now()+sec*1000;
  save();
  if(sec>0){
    pushNotif(u,`你因多次违规发言被禁言 3 小时（累计 ${count} 次）`,'warn');
    addLog('warn',`用户 ${u} 违规 ${count} 次，禁言 3 小时`);
  }
  return {count,sec};
}

function showWarn(msg){
  $('warnSub').textContent=msg;
  $('warn').classList.add('show');
  clearTimeout($('warn')._t);
  $('warn')._t=setTimeout(()=>$('warn').classList.remove('show'),2000);
}

// 系统日志
function addLog(type,text){
  logs.unshift({type,text,time:Date.now()});
  if(logs.length>500) logs.pop();
  save();
}

// 通知
function pushNotif(user,text,type,link){
  if(!user) return;
  notifs.unshift({user,text,type:type||'info',time:Date.now(),read:false,link:link||''});
  if(notifs.length>200) notifs.pop();
  save();
}
function unreadNotif(){
  return sess ? notifs.filter(n=>n.user===sess.username&&!n.read).length : 0;
}

// 登录失败锁定
function isLocked(u){
  const f=fails[u];
  if(f&&f.lockUntil>Date.now()) return f;
  // 已过期：当场清理该记录（确保倒计时归零后锁定彻底释放）
  if(f){delete fails[u];if(lockedUser===u)lockedUser='';save()}
  return null;
}
// 记住当前正在锁定中的用户名（输入框被清空时也能恢复倒计时）
let lockedUser='';
function getLockedUser(){
  if(lockedUser&&isLocked(lockedUser)) return lockedUser;
  for(const u in fails){if(isLocked(u)){lockedUser=u;return u}}
  return '';
}
function cleanFails(){let changed=false;for(const u in fails){if(!isLocked(u)){changed=true}}if(changed)save()}
function addFail(u){let f=fails[u]||{count:0};f.count++;if(f.count>=5){f.lockUntil=Date.now()+5*60*1000;lockedUser=u} fails[u]=f;save()}
function clearFail(u){if(fails[u]){delete fails[u];save()}}

// 图形验证码
function genCaptcha(){
  const c=$('cap'); if(!c) return;
  const ctx=c.getContext('2d'); if(!ctx) return; // canvas 不可用时安全退出
  c.width=120;c.height=40;
  ctx.fillStyle='#f3f4f6';ctx.fillRect(0,0,c.width,c.height);
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='';
  for(let i=0;i<4;i++){code+=chars[Math.floor(Math.random()*chars.length)]}
  captcha=code;
  for(let i=0;i<4;i++){
    ctx.font=(20+Math.random()*8)+'px Arial';
    ctx.fillStyle=`hsl(${Math.random()*360},70%,45%)`;
    ctx.save();
    ctx.translate(15+i*26,22);
    ctx.rotate((Math.random()-0.5)*0.5);
    ctx.fillText(code[i],-8,6);
    ctx.restore();
  }
  for(let i=0;i<4;i++){ctx.strokeStyle='#aaa';ctx.beginPath();ctx.moveTo(Math.random()*120,Math.random()*40);ctx.lineTo(Math.random()*120,Math.random()*40);ctx.stroke()}
  for(let i=0;i<30;i++){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(Math.random()*120,Math.random()*40,2,2)}
}

// 聊天室局部刷新：仅追加新增消息，不重建整个列表，保留输入框焦点与草稿
let chatRefreshTimer = null;
function chatAutoRefresh(){
  // 离开聊天室则停止定时器，避免后台持续 render
  if(chatRefreshTimer && page!=='chat'){ clearInterval(chatRefreshTimer); chatRefreshTimer=null; }
  if(page!=='chat') return;
  const box=$('chatBox'); if(!box) return;
  const u=sess?sess.username:'游客';
  // 仅追加比已渲染数量更多的新消息
  const rendered=box.querySelectorAll('.chat-msg').length;
  if(rendered>=chats.length) return;
  const frag=document.createDocumentFragment();
  for(let i=rendered;i<chats.length;i++){
    const c=chats[i];
    const div=document.createElement('div');
    div.className='chat-msg'+(c.author===u?' me':'');
    div.setAttribute('data-msg-idx',String(i));
    div.setAttribute('data-key',`${c.author}|${c.time}|${i}`);
    div.innerHTML=`<b>${esc(c.author)}:</b> ${esc(c.text)}`;
    frag.appendChild(div);
  }
  box.appendChild(frag);
  // 仅当用户已滚到底部时才自动滚到底（避免阅读历史时被打断）
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  if(nearBottom) box.scrollTop=box.scrollHeight;
}
function startChatRefresh(){
  if(chatRefreshTimer) return;
  chatAutoRefresh();
  chatRefreshTimer=setInterval(chatAutoRefresh,5000);
}

function pmThread(cur){
  const me=sess.username;
  const list=pms.filter(m=>(m.from===me&&m.to===cur)||(m.from===cur&&m.to===me)).sort((a,b)=>a.time-b.time);
  list.filter(m=>m.to===me&&!m.read).forEach(m=>m.read=true); save();
  return `<h3>与 ${esc(cur)} 的对话</h3>
    <div class="chat-box" id="pmBox" style="height:280px">
      ${list.map(m=>`<div class="chat-msg ${m.from===me?'me':''}">${esc(m.text)}<div class="muted" style="font-size:11px">${new Date(m.time).toLocaleTimeString()}</div></div>`).join('')||'<p class="muted">开始对话吧～</p>'}
    </div>
    <div class="row"><input id="pmi" placeholder="输入消息"><button class="btn" onclick="sendPm('${esc(cur)}')">发送</button></div>`;
}

function postDetail(a){
  const p=posts.find(x=>x.id===window._curPost);
  if(!p){go('forum');return}
  if(p.hidden&&!isAdmin()){a.innerHTML='<div class="card"><h2>该帖子已被隐藏</h2><button class="ghost" onclick="go(\'forum\')">返回</button></div>';return}
  const isFav = sess && favs.some(f=>f.user===sess.username&&f.postId===p.id);
  const isMine = sess && sess.username===p.author;
  let html=`<div class="card">
    <div class="flex" style="justify-content:space-between"><h2 style="margin:0">${esc(p.title)}</h2>
      ${isAdmin()?`<button class="ghost sm" onclick="adminToggleTop(${p.id})">${p.top?'取消置顶':'置顶'}</button>`:''}
    </div>
    <div class="meta">
      <span class="avatar sm" style="background:${avatarColor(p.author)};margin-right:4px">${(p.author[0]||'?').toUpperCase()}</span>
      ${esc(p.author)} · ${new Date(p.time).toLocaleString()} · <span class="tag">${esc(p.cat)}</span> 👁${p.views} ❤️${p.likes} 💬${p.comments.length}
      ${isFav?' ⭐':''}
    </div>
    <p style="margin-top:10px;white-space:pre-wrap">${esc(p.body)}</p>
    <div style="margin-top:10px">
      <button class="ghost" onclick="like(${p.id})">❤️ 点赞 (${p.likes})</button>
      ${sess?`<button class="ghost" onclick="toggleFav(${p.id})">${isFav?'★ 已收藏':'☆ 收藏'}</button>`:''}
      ${sess&&!isMine?`<button class="ghost" onclick="sendPm('${esc(p.author)}')">✉️ 私信作者</button>`:''}
      ${sess&&!isMine?`<button class="ghost sm" onclick="toggleFollow('${esc(p.author)}')">${follows.some(f=>f.from===sess.username&&f.to===p.author)?'✓ 已关注':'＋ 关注'}</button>`:''}
      ${isMine?`<button class="ghost sm" onclick="editPost(${p.id})">编辑</button>`:''}
      ${isMine||isAdmin()?`<button class="btn danger sm" onclick="delMyPost(${p.id})">删除帖子</button>`:''}
      ${sess&&!isMine&&!isAdmin()?`<button class="ghost sm" onclick="report('post',${p.id},'${esc(p.title).replace(/'/g,"")}')">举报</button>`:''}
    </div>
  </div>
  <div class="card"><h3>评论 (${p.comments.length})</h3>`;
  if(sess){
    html+=`<div class="row"><input id="cmi" placeholder="写下你的评论…"><button class="btn sm" onclick="addComment(${p.id})">发送</button></div>`;
  }
  html+='<div style="margin-top:10px">';
  if(!p.comments.length) html+=`<p class="muted">还没有评论，来抢沙发吧</p>`;
  p.comments.forEach((c,i)=>{
    html+=`<div class="comment" id="cm-${p.id}-${i}">
      <b>${esc(c.author)}</b> <span class="muted small">${new Date(c.time).toLocaleString()}</span>
      ${sess?`<button class="ghost sm" onclick="likeComment(${p.id},${i})">👍 ${c.likes||0}</button>`:''}
      ${sess?`<button class="ghost sm" onclick="showReply(${p.id},${i})">回复</button>`:''}
      ${isAdmin()||c.author===sess?.username?`<button class="btn danger sm" onclick="delComment(${p.id},${i})">删</button>`:''}
      ${sess&&c.author!==sess.username&&!isAdmin()?`<button class="ghost sm" onclick="report('comment','${p.id}_${i}','评论')">举报</button>`:''}
      <span style="white-space:pre-wrap">${esc(c.text)}</span>
      <div class="sub-comment" id="replies-${p.id}-${i}">`;
    (c.replies||[]).forEach((r,j)=>{
      html+=`<div><b>${esc(r.author)}</b> <span class="muted small">${new Date(r.time).toLocaleString()}</span>
        ${isAdmin()||r.author===sess?.username?`<button class="btn danger sm" onclick="delReply(${p.id},${i},${j})">删</button>`:''}
        <span style="white-space:pre-wrap">${esc(r.text)}</span></div>`;
    });
    html+=`</div></div>`;
  });
  html+='</div></div>';
  a.innerHTML=html;
}

window.dologin=async function(){
  const u=$('lu').value.trim(),v=$('lp').value,lcap=$('lcap').value;
  const f=isLocked(u);
  if(f){$('err').textContent='账号已锁定，请稍后再试';return}
  if(!u||!v){$('err').textContent='请填写完整';return}
  if(lcap.toUpperCase()!==captcha){$('err').textContent='验证码错误';genCaptcha();return}
  const user=users.find(x=>x.username===u);
  if(!user){addFail(u);$('err').textContent='账号或密码错误';genCaptcha();renderLockTip('lcap','lu');addLog('warn',`登录失败: ${u}`);return}
  // 【安全】校验哈希；兼容尚未迁移的旧明文账号（首次登录成功后自动升级为哈希）
  let ok=false;
  if(user.password && (user.password.startsWith('sha256$')||user.password.startsWith('fallback$'))){
    const h = await hashPwd(v);
    ok = (user.password===h);
  } else {
    // 旧明文数据兼容
    ok = (user.password===v);
  }
  if(!ok){addFail(u);$('err').textContent='账号或密码错误';genCaptcha();renderLockTip('lcap','lu');addLog('warn',`登录失败: ${u}`);return}
  // 迁移：把遗留明文密码升级为哈希
  if(!user.password || (!user.password.startsWith('sha256$')&&!user.password.startsWith('fallback$'))){
    user.password = await hashPwd(v); save();
  }
  if(user.banned){$('err').textContent='该账号已被封禁';return}
  clearFail(u); if(lockedUser===u) lockedUser=''; cleanFails();
  sess={username:u};sessionStorage.setItem('s',JSON.stringify(sess));
  addLog('info',`用户 ${u} 登录`);
  showHint('登录成功');go('home');
};

window.doreg=async function(){
  if(!settings.allowReg){showHint('站点已关闭注册');return}
  const u=$('ru').value.trim(),p=$('rp').value,p2=$('rp2').value,ph=$('rph').value,em=$('re').value.trim(),cap=$('rcap').value;
  if(!u||!p||!p2||!ph){$('err').textContent='请填写完整';return}
  if(users.find(x=>x.username===u)){$('err').textContent='用户名已存在';return}
  if(p!==p2){$('err').textContent='密码不一致';return}
  if(!(p.length>=8&&/\d/.test(p)&&/[a-z]/.test(p)&&/[A-Z]/.test(p))){$('err').textContent='密码需≥8位且含数字+小写+大写';return}
  if(!/^1\d{10}$/.test(ph)){$('err').textContent='手机号格式错误';return}
  if(users.find(x=>x.phone===ph)){$('err').textContent='手机号已被注册';return}
  if(settings.requireEmail&&!em){$('err').textContent='邮箱为必填项';return}
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('err').textContent='邮箱格式错误';return}
  if(cap.toUpperCase()!==captcha){$('err').textContent='验证码错误';genCaptcha();return}
  const pwdHash = await hashPwd(p); // 【安全】存储哈希而非明文
  users.push({username:u,password:pwdHash,phone:ph,email:em,role:'user',bio:'',time:Date.now()});
  save();addLog('info',`新用户注册: ${u}`);showHint('注册成功');go('login');
};

  u.password = await hashPwd(np); // 【安全】存储哈希
  save();addLog('info',`用户 ${un} 重置密码`);showHint('密码已重置，请登录');go('login');
};

window.doAdmin=async function(){
  const u=$('au').value.trim(),p=$('ap').value,cap=$('acap').value;
  if(cap.toUpperCase()!==captcha){$('err').textContent='验证码错误';genCaptcha();return}
  // 【安全】默认管理员密码也走哈希校验，避免硬编码明文（兼容旧明文迁移）
  const adminHash = await hashPwd('Admin@123');
  const adminUser = users.find(x=>x.username==='admin');
  let ok=false;
  if(adminUser && adminUser.password && (adminUser.password.startsWith('sha256$')||adminUser.password.startsWith('fallback$'))){
    ok = ((await hashPwd(p))===adminUser.password) && u==='admin';
  } else {
    ok = (u==='admin' && p==='Admin@123'); // 首次明文兼容
  }
  if(ok){
    // 迁移管理员密码为哈希
    if(adminUser && (!adminUser.password||(!adminUser.password.startsWith('sha256$')&&!adminUser.password.startsWith('fallback$')))){
      adminUser.password = adminHash; save();
    }
    admin={username:'admin'};sessionStorage.setItem('a',JSON.stringify(admin));addLog('info','管理员登录');go('admin');
  }
  else {$('err').textContent='管理员账号或密码错误';genCaptcha();}
};

window.saveProfile=async function(){

  const opw=$('opw').value,npw=$('npw').value;
  if(npw){
    // 【安全】校验原密码（支持哈希与遗留明文），新密码存哈希
    const oldHash = cu.password;
    let oldOk=false;
    if(oldHash && (oldHash.startsWith('sha256$')||oldHash.startsWith('fallback$'))){
      oldOk = (await hashPwd(opw))===oldHash;
    } else oldOk = (opw===oldHash);
    if(!oldOk){$('err').textContent='原密码错误';return}
    if(!(npw.length>=8&&/\d/.test(npw)&&/[a-z]/.test(npw)&&/[A-Z]/.test(npw))){$('err').textContent='新密码需≥8位且含数字+小写+大写';return}
    cu.password = await hashPwd(npw);$('opw').value='';$('npw').value='';addLog('info',`用户 ${cu.username} 修改密码`);
  }
  if(cu.phone&&!/^1\d{10}$/.test(cu.phone)){$('err').textContent='手机号格式错误';return}
  if(cu.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cu.email)){$('err').textContent='邮箱格式错误';return}
  save();showHint('已保存');render();
};

function doRealDeleteAccount(un){
  try {
    users=users.filter(function(u){return u.username!==un});
    posts=posts.filter(function(p){return p.author!==un});
    // 清理二级评论(replies)里的该用户回复
    posts.forEach(function(p){
      if(p.comments && p.comments.length){
        p.comments.forEach(function(c){
          if(c.replies && c.replies.length){c.replies=c.replies.filter(function(r){return r.author!==un})}
        });
        p.comments=p.comments.filter(function(c){return c.author!==un});
      }
    });
    pms=pms.filter(function(m){return m.from!==un&&m.to!==un});
    favs=favs.filter(function(f){return f.user!==un});
    follows=follows.filter(function(f){return f.from!==un&&f.to!==un});
    notifs=notifs.filter(function(n){return n.user!==un});
    reports=reports.filter(function(r){return r.reporter!==un});
    delete warns[un]; delete mutes[un]; delete fails[un];
    if(typeof dlRecords!=='undefined'){dlRecords=dlRecords.filter(function(r){return r.name!==un})}
    save();
    addLog('info','用户 '+un+' 注销账号');
    sess=null;sessionStorage.removeItem('s');
    closeDelAccountModal();
    // 用 alert 兜底，确保用户一定能看到"成功"（哪怕 showHint 已失效）
    alert('账号已成功注销，您的全部数据已永久删除。');
    go('home');render();
  } catch(e){
    // 关键：把错误真的显示出来，而不是静默失败
    console.error('注销异常:',e);
    alert('注销过程出现异常：'+e.message+'（您的会话已尝试清除，如仍异常请刷新重试）');
    addLog('warn','注销异常: '+e.message);
  }
}

window.importData=function(e){
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const d = safeParse(ev.target.result, null); // 【安全】防御原型污染
      if(!d || typeof d!=='object' || Array.isArray(d)){alert('导入失败：文件格式错误');return}
      if(!confirm('导入将覆盖当前数据，确定？'))return;
      // 【安全加固】白名单字段 + 类型校验 + role 枚举限制
      const ALLOWED = ['users','posts','chats','warns','mutes','fails','pms','reports','settings','follows','favs','notifs','logs'];
      const clean = {};
      ALLOWED.forEach(k=>{
        if(d[k]===undefined) return;
        if(['users','posts','chats','pms','reports','follows','favs','notifs','logs'].includes(k)){
          clean[k] = Array.isArray(d[k]) ? d[k].filter(x=>x&&typeof x==='object') : [];
        } else {
          clean[k] = (typeof d[k]==='object'&&d[k]!==null&&!Array.isArray(d[k])) ? d[k] : {};
        }
      });
      // 清理每条 user：只保留安全字段，role 限制为 user/admin
      if(clean.users && clean.users.length){
        clean.users = clean.users.map(u=>({
          username:String(u.username||'').slice(0,50),
          password:String(u.password||'').slice(0,200), // 迁移：若明文则保留（下次登录升级为哈希）
          phone:String(u.phone||'').slice(0,20),
          email:String(u.email||'').slice(0,100),
          role: (u.role==='admin'||u.role==='user') ? u.role : 'user', // 【安全】禁止任意 role
          bio:String(u.bio||'').slice(0,500),
          avatar:String(u.avatar||'').slice(0,500),
          time:Number(u.time)||0,
          banned: !!u.banned
        })).filter(u=>u.username);
      }
      // storage key 映射（与 save() 一致）
      const KEY = {users:'u',posts:'p',chats:'c',warns:'w',mutes:'m',fails:'f',pms:'pm',reports:'rp',settings:'cfg',follows:'fl',favs:'fv',notifs:'nt',logs:'lg'};
      ALLOWED.forEach(k=>{ if(clean[k]!==undefined) localStorage.setItem(KEY[k], JSON.stringify(clean[k])); });
      addLog('info','导入数据');location.reload();
    }catch(err){alert('导入失败：文件格式错误');}
  };
  rd.readAsText(file);
};

// 下载记录（仅本机，点击「下载」后写入；不本地安装）
let dlRecords = safeGet('store_dl', '[]');
function saveDlRecords(){localStorage.setItem('store_dl',JSON.stringify(dlRecords))}

// 下载：新窗口跳转该应用官方网址（安全无捆绑）
window.storeDownload=function(id){
  const app=APPS.find(a=>a.id===id);if(!app||!app.url){storeToast('该应用暂未收录官方下载地址');return;}
  addLog('info','软件商店：跳转官方下载 '+app.name+' ('+app.url+')');
  window.open(app.url,'_blank','noopener');
  if(!dlRecords.find(r=>r.id===id)){
    dlRecords.unshift({id,name:app.name,url:app.url,time:Date.now()});
    dlRecords=dlRecords.slice(0,30);saveDlRecords();
  }
  storeToast('已跳转官方下载页：'+app.name);
};


function appList(){
  let list = APPS.slice();
  // 分类：推荐 = 首页精选（hot + official 优先），其余按 cat 精确匹配
  // 搜索优先：有搜索词时跨全库匹配（名称/描述/分类/关键词）
  if(storeKw){
    const k=storeKw.toLowerCase();
    list = APPS.filter(a =>
      a.name.toLowerCase().includes(k) ||
      a.desc.toLowerCase().includes(k) ||
      (a.cat||'').toLowerCase().includes(k) ||
      (a.keywords||'').toLowerCase().includes(k)
    );
  } else if(storeCat==='推荐'){
    list = list.filter(a=>a.hot==='1').sort((a,b)=>b.downloads-a.downloads);
  } else {
    list = list.filter(a=>a.cat===storeCat);
  }
  return list;
}

function storeToast(msg){
  let el=$('storeToast');
  if(!el){el=document.createElement('div');el.id='storeToast';el.className='store-toast';document.body.appendChild(el)}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

function renderLockTip(capId,uid){
  // 优先用输入框用户名，输入框为空时回退到锁定记忆（防止切页/清空后倒计时消失）
  let u=$(uid)&&$(uid).value.trim();
  if(!u) u=getLockedUser();
  const tip=$('lockTip'); if(!tip) return;
  const f=isLocked(u);
  if(f){const left=Math.ceil((f.lockUntil-Date.now())/1000);
    lockedUser=u; // 锁定中持续记忆
    tip.innerHTML=`<div class="err" style="background:#fee2e2;padding:8px;border-radius:8px">⚠️ 账号「${u}」已锁定，请 ${Math.floor(left/60)}分${left%60}秒 后再试</div>`;
    if($('lcap'))$('lcap').disabled=true;
    // 倒计时归零时 isLocked 已自动清理，这里刷新为正常态
    if(left<=0) renderLockTip(capId,uid);
  } else {
    const cnt=(fails[u]&&fails[u].count)||0;
    tip.innerHTML=u?`<div class="small" style="color:#f59e0b">已失败 ${cnt}/5 次</div>`:'';
    if($('lcap'))$('lcap').disabled=false;
    // 解锁后恢复登录按钮（倒计时归零时也能即时启用）
    const btn=document.querySelector('#app .card button.btn');
    if(btn) btn.disabled=false;
  }
}
